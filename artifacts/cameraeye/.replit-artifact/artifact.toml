kind = "web"
previewPath = "/"
title = "CameraEye"
version = "1.0.0"
id = "artifacts/cameraeye"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20020

[services.development]
run = "pnpm --filter @workspace/cameraeye run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cameraeye", "run", "build" ]
serve = "static"
publicDir = "artifacts/cameraeye/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20020"
BASE_PATH = "/"
